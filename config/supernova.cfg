# Configuration file

client {
    # Tint blend mode for combining block and sky light color.
    # Possible values: [ADDITIVE, SQUARED_WEIGHT, LINEAR_WEIGHT, OKLAB, VIVID]
    #  [default: SQUARED_WEIGHT]
    S:tintBlendMode=SQUARED_WEIGHT
}


general {
    # Lighting mode. RGB = colored light (3-channel). SCALAR = fast Starlight-equivalent (no color).
    # Possible values: [RGB, SCALAR]
    #  [default: RGB]
    S:lightingMode=SCALAR

    # Scale registered block colors so their max channel matches the block's vanilla lightValue. [default: true]
    B:scaleEmissionToVanillaLight=true
}


