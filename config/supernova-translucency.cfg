# Supernova Block Translucency
#
# Format: modid:blockname = r, g, b
#         modid:blockname:meta = r, g, b
#
# r, g, b are transmittance per channel (0 = fully opaque, 15 = fully transparent).
# Omit :meta to apply to all metadata values.
# Entries here override built-in defaults.
# Blocks without an entry use vanilla opacity uniformly across all channels.
#
# Examples:
# minecraft:stained_glass:0 = 15, 15, 15
# minecraft:stained_glass:1 = 2, 10, 15
# minecraft:ice = 12, 12, 12
#
# Use /supernova translucency dump to export all current entries to this file.
