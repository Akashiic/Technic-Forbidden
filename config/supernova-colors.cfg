# Supernova Block Light Colors
#
# Format: modid:blockname = r, g, b
#         modid:blockname:meta = r, g, b
#
# r, g, b are 0-15 (light intensity per channel).
# Omit :meta to apply to all metadata values.
# Entries here override built-in defaults.
# Blocks with vanilla light emission but no entry here
# automatically emit white light at vanilla intensity.
#
# Examples:
# minecraft:torch = 15, 13, 10
# minecraft:glowstone = 15, 14, 10
# ProjRed|Illumination:projectred.illumination.lamp:0 = 15, 15, 15
#
# Use /supernova colors dump to export all current entries to this file.
